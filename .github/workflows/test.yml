name: Run Playwright tests

on:
  push: # runs on every push
  pull_request: # runs on new PRs or PR updates
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
    inputs:
      td_env:
        description: Which TestDino to report to
        type: choice
        default: staging
        options: [staging, prod, local]
      testdino_rerun_of:
        description: Source run id, when this run re-runs another run's tests
        required: false
      testdino_rerun_args:
        description: Which of that run's tests (--scope / --test-ids / --exclude-ids)
        required: false

jobs:
  run-tests:
    name: Run shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]

    env:
      # TD_ENV is the single switch; playwright.config.js turns it into a URL —
      # including the ngrok tunnel for `local`, which a runner cannot reach
      # otherwise. dotenv never overrides a variable already in the environment,
      # so this wins over any .env the job writes.
      TD_ENV: ${{ inputs.td_env || 'staging' }}
      TESTDINO_TOKEN: ${{ inputs.td_env == 'local' && secrets.TESTDINO_TOKEN_LOCAL || secrets.TESTDINO_TOKEN }}
      TESTDINO_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env
        run: |
          echo "USERNAME=${{ secrets.USERNAME }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "NEW_PASSWORD=${{ secrets.NEW_PASSWORD }}" >> .env
          echo "FIRST_NAME=${{ secrets.FIRST_NAME }}" >> .env
          echo "STREET_NAME=${{ secrets.STREET_NAME }}" >> .env
          echo "CITY=${{ secrets.CITY }}" >> .env
          echo "STATE=${{ secrets.STATE }}" >> .env
          echo "COUNTRY=${{ secrets.COUNTRY }}" >> .env
          echo "ZIP_CODE=${{ secrets.ZIP_CODE }}" >> .env

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      # One place decides the URL: the config. Exporting it here is only so the
      # CLI's own calls (auth, test selection) agree with the reporter's.
      - name: Resolve the TestDino server from TD_ENV
        run: |
          [ -n "${TESTDINO_TOKEN:-}" ] || { echo "::error::No token for TD_ENV=$TD_ENV"; exit 1; }
          URL=$(node --input-type=module -e "
            const m = await import('./playwright.config.js');
            process.stdout.write(m.default.reporter[0][1].serverUrl);
          ")
          echo "Reporting to $URL (TD_ENV=$TD_ENV)"
          echo "TESTDINO_SERVER_URL=$URL" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        run: |
          npx tdpw test \
            --ci-run-id "$TESTDINO_CI_RUN_ID" \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --workers=5 \
            ${RERUN_OF:+--last-failed --from-run "$RERUN_OF" $RERUN_ARGS}
        env:
          RERUN_OF: ${{ inputs.testdino_rerun_of }}
          RERUN_ARGS: ${{ inputs.testdino_rerun_args }}
