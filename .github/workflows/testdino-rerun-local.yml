name: TestDino re-run (local, self-hosted)

# Proves the ONE thing that separates the two re-run flows: which commit's code
# actually executes.
#
#   testdino_rerun_sha set   → SAME-COMMIT re-run. Runs the source run's own
#                              commit, so a test that now passes was flaky
#                              rather than fixed.
#   testdino_rerun_sha empty → LATEST re-run. Runs the tip of the branch, to
#                              check whether a fix worked.
#
# The pin cannot travel as the dispatch `ref`: GitHub's workflow_dispatch takes
# only a branch or tag there and resolves it to that branch's TIP at dispatch
# time. So it arrives as this input and the checkout step below applies it. A
# workflow that declares the input and does not use it is worse than one that
# never declared it — the dispatch is accepted, the branch tip runs, and the
# result is still recorded as a re-run of the original.
#
# Self-hosted on purpose: the reporter sends results to what the server
# advertises (localhost:3004 / :19092), so only a runner ON the Mac running the
# stack can deliver them. See testdino-orchestrate-staging.yml for the full why.
#
# The test SELECTION inputs (testdino_rerun_from / _scope / _test_ids /
# _exclude_ids) are deliberately NOT declared here: the vendored CLI is 2.6.0,
# which has no `--rerun`, and declaring an input this workflow cannot honour is
# the exact failure described above. Selection is a separate axis and identical
# in both flows.

on:
  workflow_dispatch:
    inputs:
      testdino_rerun_sha:
        description: Commit to check out. Set = same-commit re-run; empty = latest on the branch.
        required: false
      spec:
        description: Which spec to run (kept small so the two dispatches are quick to compare)
        type: choice
        default: tests/get-users.spec.js
        options:
          - tests/get-users.spec.js
          - tests/post-api.spec.js

env:
  TESTDINO_SERVER_URL: http://localhost:3005
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN_LOCAL }}
  CLI_TARBALL: ./temp-cli/testdino-playwright-2.6.0.tgz

jobs:
  rerun:
    name: ${{ inputs.testdino_rerun_sha != '' && 'same-commit' || 'latest' }}
    runs-on: [self-hosted, testdino-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      # The assertion, not the echo, is the point: a pin that silently failed to
      # apply would otherwise look exactly like a successful same-commit re-run.
      - name: Assert the pin took effect
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tip=${{ github.sha }}
          want='${{ inputs.testdino_rerun_sha }}'
          echo "checked out : $head"
          echo "branch tip  : $tip"
          if [ -n "$want" ]; then
            echo "mode        : same-commit (pinned to $want)"
            [ "$head" = "$want" ] || { echo "::error::pin did not apply — checked out $head, wanted $want"; exit 1; }
            if [ "$head" = "$tip" ]; then
              echo "::warning::the pinned commit IS the branch tip, so this run cannot show the difference"
            fi
          else
            echo "mode        : latest"
            [ "$head" = "$tip" ] || { echo "::error::expected the branch tip $tip, got $head"; exit 1; }
          fi
          echo "specs present at this commit:"
          ls tests/*.spec.js | sed 's/^/  /'

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: ./.github/actions/install-tdpw

      - name: Run the tests at the checked-out commit
        run: |
          npx tdpw test \
            --ci-run-id "rerun-${{ github.run_id }}-${{ github.run_attempt }}" \
            --project=api \
            ${{ inputs.spec }}
