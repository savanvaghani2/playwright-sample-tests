name: TestDino re-run (local, self-hosted)

# The two re-run flows, differing in one thing: which commit's code executes.
#
#   testdino_rerun_sha set   → SAME-COMMIT re-run. Runs the source run's own
#                              commit, so a test that now passes was flaky
#                              rather than fixed.
#   testdino_rerun_sha empty → LATEST re-run. Runs the tip of the branch, to
#                              check whether a fix worked.
#
# The pin cannot travel as the dispatch `ref`: workflow_dispatch accepts only a
# branch or tag there and resolves it to that branch's TIP at dispatch time. So
# it arrives as an input and the checkout step applies it. A workflow that
# declares the input and never uses it is worse than one that never declared
# it — the dispatch is accepted, the branch tip runs, and the result is still
# recorded as a re-run of the original.
#
# The four input names are the dashboard's contract, not ours: the integration
# service reads this file, sends only the inputs it finds declared, and hides
# the workflow from the re-run sheet entirely without testdino_rerun_from.
#
# Self-hosted on purpose: the reporter sends results to what the server
# advertises (localhost:3004 / :19092), so only a runner ON the Mac running the
# stack can deliver them. See testdino-orchestrate-staging.yml for the full why.
#
# Pinned to the vendored CLI 2.7.0, not the 2.6.0 the other workflows use:
# `--rerun` does not exist below it, and a published `npx tdpw` fails with
# `unknown option '--rerun'`.

on:
  workflow_dispatch:
    inputs:
      testdino_rerun_from:
        description: Source run id, when this run re-runs another run's tests
        required: false
      testdino_rerun_scope:
        description: Which of that run's tests to re-run
        type: choice
        default: failed
        options: [failed, flaky, all]
      testdino_rerun_test_ids:
        description: Comma-separated test ids, for an exact selection
        required: false
      testdino_rerun_exclude_ids:
        description: Comma-separated test ids to drop from the scope
        required: false
      testdino_rerun_sha:
        description: Commit to check out. Set = same-commit re-run; empty = latest on the branch.
        required: false

env:
  TESTDINO_SERVER_URL: http://localhost:3005
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN_LOCAL }}
  CLI_TARBALL: ./temp-cli/testdino-playwright-2.7.0.tgz

jobs:
  rerun:
    name: ${{ inputs.testdino_rerun_sha != '' && 'same-commit' || 'latest' }}
    runs-on: [self-hosted, testdino-local]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      # The assertion, not the echo, is the point: a pin that silently failed to
      # apply looks exactly like a successful same-commit re-run.
      - name: Assert the pin took effect
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tip=${{ github.sha }}
          want='${{ inputs.testdino_rerun_sha }}'
          echo "checked out : $head"
          echo "branch tip  : $tip"
          if [ -n "$want" ]; then
            echo "mode        : same-commit (pinned to $want)"
            [ "$head" = "$want" ] || { echo "::error::pin did not apply — checked out $head, wanted $want"; exit 1; }
            if [ "$head" = "$tip" ]; then
              echo "::warning::the pinned commit IS the branch tip, so this run cannot show the difference"
            fi
          else
            echo "mode        : latest"
            [ "$head" = "$tip" ] || { echo "::error::expected the branch tip $tip, got $head"; exit 1; }
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Not ./.github/actions/install-tdpw: that action asserts 2.6.0, which the
      # other workflows depend on. This one needs 2.7.0 for `--rerun`.
      - name: Install deps and the vendored tdpw 2.7.0
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "$CLI_TARBALL"
          got=$(npx tdpw --version | tail -1 | tr -d '[:space:]')
          echo "tdpw $got"
          [ "$got" = "2.7.0" ] || { echo "::error::expected the vendored tdpw 2.7.0, got '$got'"; exit 1; }

      - name: Run the tests at the checked-out commit
        env:
          RERUN_FROM: ${{ inputs.testdino_rerun_from }}
          RERUN_SCOPE: ${{ inputs.testdino_rerun_scope }}
          RERUN_TEST_IDS: ${{ inputs.testdino_rerun_test_ids }}
          RERUN_EXCLUDE_IDS: ${{ inputs.testdino_rerun_exclude_ids }}
        run: |
          # --rerun carries the scope as its value (failed|flaky|all) and needs
          # --from-run; the id selections are their own flags. `if`, not `&&`:
          # Actions runs this with `bash -e`, where a false test as the last
          # command of a line fails the whole step.
          set -- --ci-run-id "rerun-${{ github.run_id }}-${{ github.run_attempt }}"
          if [ -n "${RERUN_FROM:-}" ]; then
            set -- "$@" --rerun "${RERUN_SCOPE:-failed}" --from-run "$RERUN_FROM"
            if [ -n "${RERUN_TEST_IDS:-}" ]; then
              set -- "$@" --test-ids "$RERUN_TEST_IDS"
            fi
            if [ -n "${RERUN_EXCLUDE_IDS:-}" ]; then
              set -- "$@" --exclude-ids "$RERUN_EXCLUDE_IDS"
            fi
          else
            # No source run: a plain baseline over the api project, which is what
            # produces the failures a later re-run selects from.
            set -- "$@" --project=api tests/get-users.spec.js
          fi
          npx tdpw test "$@"
