name: TestDino orchestrate-mode (local, self-hosted)

# Manual validation of TestDino ORCHESTRATED mode against the LOCAL stack, run on
# SELF-HOSTED runners on the same Mac as that stack. One workflow run == one
# orchestration: a single `orchestrate discover` pre-step mints a shared id, then
# N machines connect over WebSocket and the service PUSHES spec batches to them
# until the queue drains. Every batch merges into ONE test_runs row in the local
# ingestion DB. The local equivalent is scripts/orch-local.sh (npm run test:orch).
#
# ── Why self-hosted, and not a tunnel ───────────────────────────────────────
# The reporter does not choose where to send results: it uses what the server
# advertises in the auth response — `auth.kafka.brokers` and `auth.httpFallback`
# — and the local stack advertises localhost:19092 and localhost:3004. There is no
# client-side override. On a GitHub-hosted runner those resolve to the RUNNER, so
# a run reaches the control plane, executes every spec, and then dies with
# "Kafka connection failed" + "ECONNREFUSED 127.0.0.1:3004" having delivered
# nothing. An HTTP tunnel in front of :3005 cannot fix that: it carries auth, mint
# and the WebSocket dispatch, but the data plane is a different address that the
# server still hands out as localhost. A runner ON the Mac makes localhost true.
#
# REQUIREMENTS on the Mac:
#   1. the local stack is up: data-handler :3005, ingestion :3004, kafka :19092
#   2. the orchestrator is ENABLED — it ships dark. ORCHESTRATE_PUSH_ENABLED,
#      ORCHESTRATION_CONTROL_ENABLED and KAFKA_ORCHESTRATION_CONTROL_ENABLED must
#      all be true, then redeploy data-handler + ingestion. Preflight fails below
#      rather than letting the run half-work.
#   3. AT LEAST AS MANY RUNNERS AS `machines`, all labelled `testdino-local`.
#      This is not an optimisation. A runner executes one job at a time, so with a
#      single runner m1 starts alone, drains the entire queue, and m2 only then
#      starts, connects to a drained orchestration and exits on `end`. The result
#      looks like a pass with half the machines contributing nothing.
#
# The CLI under test is temp-cli/testdino-playwright-2.6.0.tgz, installed by path
# on every job so `npx tdpw` is that build and never the published package.
#
# ── Why the scope is what it is ─────────────────────────────────────────────
# The dispatch unit is (file, project): one file goes to ONE machine, so a single
# slow file sets the wall-clock floor no matter how many machines you add. Timed
# on this Mac at 5 workers:
#     api project, all 5 files ......... 109 cases, 2m32s
#       └ split-statuses.spec.js alone ... 80 cases, 219s of that 264s total
#     the other 4 api files ............. 29 cases, ~45s (19s over 2 machines)
#     chromium demo specs (passed/failed/flaky/skipped/multi-browser) .. 9m16s
# api-lite therefore excludes split-statuses: it is 83% of the api cost sitting in
# one indivisible unit.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all = orchestration + a sibling sharded run (~3m); api-lite = 4 api files (~20s); api-full adds the 80-case split-statuses; browser = TDV2-831 multi-project only; shards = the sharded path alone"
        type: choice
        default: "all"
        options: ["all", "api-lite", "api-full", "browser", "shards"]
      machines:
        description: "Machines to distribute across — you must have at least this many runners online"
        type: choice
        default: "2"
        options: ["2", "3", "4"]

# Never cancel an orchestration mid-flight. A cancelled machine drops its
# WebSocket with specs still inflight, which the dispatcher reads as a crash: the
# specs are re-queued with a cooldown, and once every machine has exhausted its 2
# attempts they go could-not-execute and the run finalizes `incomplete`.
concurrency:
  group: testdino-orchestrate-${{ github.run_id }}
  cancel-in-progress: false

env:
  # Explicit, because playwright.config.js maps TD_ENV=local to the ngrok tunnel
  # whenever CI is set — correct for a GitHub-hosted runner, wrong here. An
  # explicit URL wins over that mapping.
  TESTDINO_SERVER_URL: http://localhost:3005
  # The orch project's LOCAL token. A staging/prod token is a 401 here.
  TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN_LOCAL }}
  TD_ENV: local
  CLI_TARBALL: ./temp-cli/testdino-playwright-2.6.0.tgz

jobs:
  # Preflight is folded in here rather than living in its own job: a separate job
  # costs a full runner startup for two curls. The probes still run BEFORE the
  # mint, so a down stack or a disabled orchestrator fails without minting.
  discover:
    runs-on: [self-hosted, testdino-local]
    timeout-minutes: 2
    outputs:
      orchestration_id: ${{ steps.mint.outputs.orchestration_id }}
      spec_count: ${{ steps.mint.outputs.spec_count }}
      machine_ids: ${{ steps.mint.outputs.machine_ids }}
    steps:
      - name: Verify the local stack is up with the orchestrator enabled
        run: |
          set -uo pipefail
          [ -n "${TESTDINO_TOKEN:-}" ] || { echo "::error::no local TestDino token"; exit 1; }
          echo "Target: $TESTDINO_SERVER_URL"

          # The mint, authed with an empty body. 400 (suiteFingerprint required)
          # proves the route is mounted; 404 means either the build predates the
          # endpoint or the project is soft-locked — both fatal. 000 means the
          # data-handler is not listening on :3005.
          mint=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' \
            -X POST "$TESTDINO_SERVER_URL/api/v1/orchestrate/discover" \
            -H "Authorization: Bearer $TESTDINO_TOKEN" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "POST /api/v1/orchestrate/discover -> HTTP $mint (400 expected)"
          if [ "$mint" != "400" ]; then
            echo "::error::mint not usable ($mint). 000 = the local data-handler is not up on :3005. 404 = endpoint absent from this build, or the project is soft-locked. 401 = wrong-environment token (this workflow needs the LOCAL one)."
            exit 1
          fi

          # The WS hub, deliberately UNAUTHENTICATED. Auth middleware runs before
          # the hub, so 401 proves the route is mounted and 404 proves it is not —
          # i.e. ORCHESTRATE_PUSH_ENABLED is false. Sending the token here would
          # NOT distinguish them: an authed probe of a nonexistent orchestration
          # also returns 404 (the tenant cloak), so the check would always pass.
          ws=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' \
            "$TESTDINO_SERVER_URL/ws/orchestrate/orch_preflight?machineId=probe" || echo 000)
          echo "GET /ws/orchestrate/{id} (no auth) -> HTTP $ws (401 expected)"
          if [ "$ws" = "404" ]; then
            echo "::error::the WS hub is not mounted — set ORCHESTRATE_PUSH_ENABLED=true on the data-handler reader and redeploy. Without it the mint succeeds and only the socket 404s, which looks like a CLI bug."
            exit 1
          fi
          if [ "$ws" != "401" ]; then
            echo "::error::unexpected WS probe status ($ws); expected 401 (mounted) or 404 (unmounted)."
            exit 1
          fi

          # The data plane. Unreachable here means results are silently discarded
          # after every spec has run — the exact failure self-hosted exists to
          # avoid — so fail before minting rather than after executing.
          for hostport in localhost:3004 localhost:19092; do
            nc -z -G 2 "${hostport%:*}" "${hostport#*:}" \
              || { echo "::error::$hostport unreachable — the reporter delivers results there (auth.httpFallback / auth.kafka.brokers) and would discard the whole run."; exit 1; }
            echo "$hostport reachable"
          done
          echo "Local stack is up and both orchestrator surfaces are mounted."

      - uses: actions/checkout@v7
      # Kept even though the Mac has node 22: the runner started via svc.sh runs
      # under launchd with a minimal PATH, where a system node is not guaranteed.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: ./.github/actions/install-tdpw

      - name: Mint the orchestration
        id: mint
        env:
          MACHINES: ${{ inputs.machines }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # discover filters by --project/--grep only (it lists the whole testDir),
          # so the spec set is chosen by filter, never by path.
          case "$MODE" in
            api-lite)
              # There is no --grep-invert, so split-statuses is excluded by a
              # positive pattern instead: every one of the four API describes ends
              # in "User API"/"Users API", and the split suites ("Split Passed
              # Suite", …) match none of it. 29 cases, 4 dispatch units.
              npx tdpw orchestrate discover --machines "$MACHINES" \
                --project api --grep "Users? API" --out master.json
              ;;
            api-full)
              npx tdpw orchestrate discover --machines "$MACHINES" \
                --project api --out master.json
              ;;
            all)
              # Every orchestration dimension in one run:
              #   multi-project  chromium + firefox, so multi-browser.spec.js is
              #                  TWO (file, project) units (TDV2-831)
              #   >1 machine     13 units over the matrix, each machine gets work
              #   workers        fullyParallel + workers>1, so a machine runs
              #                  several tests at once (the W axis)
              #   all outcomes   passed / failed / flaky+retry / skipped specs
              #   idle tail      uneven file durations leave a machine waiting
              # No --grep: the whole chromium+firefox set is the point.
              npx tdpw orchestrate discover --machines "$MACHINES" \
                --project chromium firefox --out master.json
              ;;
            browser)
              # multi-browser.spec.js carries all five browser tags, so ONE file
              # yields TWO (file, project) units — the multi-project regression
              # (TDV2-831). The --grep also proves grep propagation: the dispatcher
              # echoes it on every assign frame so a batch runs only the discovered
              # tests rather than the whole file.
              npx tdpw orchestrate discover --machines "$MACHINES" \
                --project chromium firefox --grep "Multi Browser" --out master.json
              ;;
          esac

          id=$(node -e "process.stdout.write(require('./master.json').orchestrationId)")
          specs=$(node -e "process.stdout.write(String(require('./master.json').specCount))")
          [ "$specs" != "0" ] || { echo "::error::discover matched 0 specs — the filters exclude everything"; exit 1; }

          # The matrix size is derived from the SAME input discover was given, so
          # the two can never drift. A matrix larger than --machines skews the LPT
          # plan; smaller just under-uses the queue.
          ids=$(node -e "process.stdout.write(JSON.stringify(Array.from({length:Number(process.env.MACHINES)},(_,i)=>'m'+(i+1))))")

          echo "orchestration_id=$id" >> "$GITHUB_OUTPUT"
          echo "spec_count=$specs"    >> "$GITHUB_OUTPUT"
          echo "machine_ids=$ids"     >> "$GITHUB_OUTPUT"
          echo "::notice::minted $id with $specs specs across $MACHINES machines"

      # Replaces a `verdict` job. A job of its own would add a whole runner startup
      # to the critical path just to print text, and on self-hosted it would also
      # occupy a runner the machines need.
      - name: Explain how to read the run
        env:
          ORCH_ID: ${{ steps.mint.outputs.orchestration_id }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### orchestration \`$ORCH_ID\`
          mode **${{ inputs.mode }}** · ${{ steps.mint.outputs.spec_count }} specs · ${{ inputs.machines }} machines

          A machine job exiting 0 only means it received the \`end\` signal — its
          tests may still have failed (ORCH-F2, tracked on the CLI). A green matrix
          is NOT evidence the suite passed; read the run status instead:
          \`incomplete\` = a spec could not execute on ANY machine (2 attempts each).

          \`\`\`sh
          # the ONE merged row
          docker exec ingestion-timescaledb psql -U postgres -d ingestion_dev -c \\
            "SELECT id, status, total_tests, could_not_execute_specs
               FROM test_runs WHERE orchestration_id = '$ORCH_ID';"

          # per-machine attribution — the point of device_id
          docker exec ingestion-timescaledb psql -U postgres -d ingestion_dev -c \\
            "SELECT device_id, count(*) FROM test_cases
              WHERE run_id = (SELECT id FROM test_runs WHERE orchestration_id = '$ORCH_ID')
              GROUP BY 1 ORDER BY 1;"
          \`\`\`
          EOF

  machine:
    needs: discover
    name: machine ${{ matrix.machine }}
    # No `container:` — GitHub Actions does not support job containers on macOS
    # runners, and none is needed: the browsers are already installed on the Mac.
    runs-on: [self-hosted, testdino-local]
    # Generous: a cancelled machine drops its socket mid-batch, which the
    # dispatcher reads as a crash and re-queues, so a tight cap manufactures
    # the exact failure this workflow exists to observe.
    timeout-minutes: 12
    strategy:
      # A machine that fails must NOT cancel its siblings: they are still holding
      # inflight specs, and cancelling them would crash-requeue that work.
      fail-fast: false
      # NO max-parallel. Every machine must be connected at once — see the header.
      matrix:
        machine: ${{ fromJSON(needs.discover.outputs.machine_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: ./.github/actions/install-tdpw
      - name: Join ${{ needs.discover.outputs.orchestration_id }} as ${{ matrix.machine }}
        # GitHub Actions has no native per-machine index, so the device id comes
        # from the matrix. It MUST be unique per leg: two machines reporting the
        # same id collapse into one row in the per-machine breakdown and corrupt
        # the crash/attempt ledger, which is keyed on (spec, machineId).
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # Workers is the INTRA-machine axis: one machine runs W tests at once.
          # Capped for `all` because 3 machines x 5 workers is 15 concurrent
          # browsers against the shared demo site, which fails tests for reasons
          # unrelated to orchestration. 2 still exercises W>1. Harmless that
          # discover recorded W=5 from the config: under fullyParallel the
          # dispatcher hands out 1 spec regardless of W, so W only weighted LPT.
          workers_args=()
          if [ "$MODE" = "all" ]; then workers_args=(--workers=2); fi

          npx tdpw orchestrate run \
            --orchestration-id "${{ needs.discover.outputs.orchestration_id }}" \
            --device-id "${{ matrix.machine }}" \
            "${workers_args[@]}"

  # Asserts the run actually exercised what the mode claims, straight from the
  # local DB. Possible only because the runner IS the machine hosting the stack;
  # a green matrix proves the machines exited, not that the data landed.
  verify:
    needs: [discover, machine, shards]
    if: always() && needs.discover.result == 'success'
    runs-on: [self-hosted, testdino-local]
    timeout-minutes: 3
    steps:
      - name: Assert the orchestration landed
        env:
          ORCH_ID: ${{ needs.discover.outputs.orchestration_id }}
          SPEC_COUNT: ${{ needs.discover.outputs.spec_count }}
          MODE: ${{ inputs.mode }}
          MACHINES: ${{ inputs.machines }}
        run: |
          set -uo pipefail
          psql() { docker exec ingestion-timescaledb psql -U postgres -d ingestion_dev -tAc "$1"; }

          # The drain signal finalizes in seconds; the reaper fallback takes 15
          # minutes, so poll rather than assume either.
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(psql "SELECT id FROM test_runs WHERE orchestration_id='$ORCH_ID'" | tr -d '[:space:]')
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "::error::no test_runs row for $ORCH_ID — nothing reached the DB"; exit 1; }
          echo "run_id=$run_id"

          fail=0
          check() { # name expected actual
            if [ "$2" = "$3" ]; then echo "  ok    $1: $3"
            else echo "::error::$1: got '$3', want '$2'"; fail=1; fi
          }
          atleast() {
            if [ "$3" -ge "$2" ] 2>/dev/null; then echo "  ok    $1: $3 (>= $2)"
            else echo "::error::$1: got '$3', want >= $2"; fail=1; fi
          }

          echo "── one merged run row, not one per machine ──"
          check "rows for this orchestration" 1 \
            "$(psql "SELECT count(*) FROM test_runs WHERE orchestration_id='$ORCH_ID'")"

          echo "── every machine is attributed ──"
          atleast "machines reporting cases" "$MACHINES" \
            "$(psql "SELECT count(DISTINCT device_id) FROM test_cases WHERE run_id='$run_id' AND device_id IS NOT NULL")"
          check "cases with no machine" 0 \
            "$(psql "SELECT count(*) FROM test_cases WHERE run_id='$run_id' AND device_id IS NULL")"

          echo "── per-machine buckets reconcile with the run header ──"
          check "sum(machine tests) == header total" "$(psql "SELECT total_tests FROM test_runs WHERE id='$run_id'")" \
            "$(psql "SELECT count(DISTINCT pw_test_id) FROM test_cases WHERE run_id='$run_id'")"

          echo "── coverage integrity ──"
          check "specs no machine could run" "" \
            "$(psql "SELECT could_not_execute_specs FROM test_runs WHERE id='$run_id'" | tr -d '[:space:]')"

          if [ "$MODE" = "all" ] || [ "$MODE" = "browser" ]; then
            echo "── multi-project dispatch (TDV2-831) ──"
            atleast "distinct playwright projects" 2 \
              "$(psql "SELECT count(DISTINCT title_path->>1) FROM test_cases WHERE run_id='$run_id'")"
          fi

          if [ "$MODE" = "all" ]; then
            echo "── the W axis: >1 test in flight on one machine ──"
            atleast "max concurrent workers on a machine" 2 \
              "$(psql "SELECT COALESCE(MAX(c),0) FROM (SELECT device_id, count(DISTINCT parallel_index) c FROM test_cases WHERE run_id='$run_id' GROUP BY device_id) w")"
            echo "── retries reached the DB as extra attempts ──"
            atleast "retry rows" 1 \
              "$(psql "SELECT count(*) FROM test_cases WHERE run_id='$run_id' AND retry > 0")"
            echo "── outcome variety ──"
            atleast "distinct case statuses" 2 \
              "$(psql "SELECT count(DISTINCT status) FROM test_cases WHERE run_id='$run_id' AND status IS NOT NULL")"
          fi

          echo
          # ORDER BY must name the grouped expressions: the select list is one
          # concatenated column, so positional ORDER BY 1,2 is out of range.
          psql "SELECT device_id || '  ' || (title_path->>1) || '  tests=' || count(DISTINCT pw_test_id) || '  rows=' || count(*) FROM test_cases WHERE run_id='$run_id' GROUP BY device_id, title_path->>1 ORDER BY device_id, title_path->>1" \
            | sed 's/^/  /'

          if [ "$MODE" = "all" ] || [ "$MODE" = "shards" ]; then
            echo
            echo "── sibling sharded run (the shard path, which shares GetCaseRows) ──"
            sharded_id=$(psql "SELECT id FROM test_runs WHERE ci_run_id='sharded-${{ github.run_id }}-${{ github.run_attempt }}'" | tr -d '[:space:]')
            if [ -z "$sharded_id" ]; then
              echo "::error::no sharded run row for this workflow run"; fail=1
            else
              check "declared shards" 2 "$(psql "SELECT total_shards FROM test_runs WHERE id='$sharded_id'")"
              atleast "shards reporting cases" 2 \
                "$(psql "SELECT count(DISTINCT shard_index) FROM test_cases WHERE run_id='$sharded_id' AND shard_index IS NOT NULL")"
              # Orchestration and sharding are separate run modes, never one run.
              check "sharded run carries no orchestration" "" \
                "$(psql "SELECT COALESCE(orchestration_id,'') FROM test_runs WHERE id='$sharded_id'" | tr -d '[:space:]')"
              check "sharded cases carry no device" 0 \
                "$(psql "SELECT count(*) FROM test_cases WHERE run_id='$sharded_id' AND device_id IS NOT NULL")"
              psql "SELECT 'shard ' || shard_index || '  tests=' || count(DISTINCT pw_test_id) FROM test_cases WHERE run_id='$sharded_id' GROUP BY shard_index ORDER BY shard_index" | sed 's/^/  /'
            fi
            echo "── and the orchestrated run records no shard total ──"
            check "orchestrated total_shards" "" \
              "$(psql "SELECT COALESCE(total_shards::text,'') FROM test_runs WHERE id='$run_id'" | tr -d '[:space:]')"
          fi

          exit $fail

  shards:
    # Runs after `machine` so the two do not compete for the same runners.
    needs: [discover, machine]
    if: always() && (inputs.mode == 'all' || inputs.mode == 'shards')
    name: shard ${{ matrix.shard }}/2
    runs-on: [self-hosted, testdino-local]
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: ./.github/actions/install-tdpw
      - name: Run shard ${{ matrix.shard }}/2
        env:
          # Both legs MUST share this: ci-run-id is the shard group key, so a
          # per-leg value produces two unrelated single-shard runs instead of one
          # two-shard run.
          CI_RUN_ID: sharded-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx tdpw test \
            --ci-run-id "$CI_RUN_ID" \
            --shard=${{ matrix.shard }}/2 \
            --project=api \
            tests/post-api.spec.js tests/get-users.spec.js
