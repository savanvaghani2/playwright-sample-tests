name: Install deps and the vendored tdpw CLI
description: >
  Installs dependencies and guarantees `npx tdpw` is the vendored 2.6.0 build.
  No actions/cache here: on a self-hosted Mac the npm cache is already warm and
  the Playwright browsers are installed system-wide, so a cache round-trip would
  cost more than it saves.

runs:
  using: composite
  steps:
    - shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund

    # package.json already carries the tarball as a `file:` dep, but installing it
    # by path as well means a stale lockfile cannot leave `npx tdpw` pointing at a
    # published build that does not understand `orchestrate`.
    - shell: bash
      run: npm install --no-save --no-audit --no-fund "$CLI_TARBALL"

    # The assertion is the only thing standing between a surprise resolution and a
    # run that silently exercises the wrong CLI.
    - shell: bash
      run: |
        set -euo pipefail
        got=$(npx tdpw --version | tail -1 | tr -d '[:space:]')
        echo "tdpw $got"
        [ "$got" = "2.6.0" ] || { echo "::error::expected the vendored tdpw 2.6.0, got '$got'"; exit 1; }
